---
- name: Test the settings module against node_exporter
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../meta/areas.yml
  module_defaults:
    group/routerops.opnsense.opnsense:
      path: "{{ opnsense_test_area['path'] }}"
      key: "{{ opnsense_test_area['key'] }}"
      ordered_fields: "{{ opnsense_test_area['ordered_fields'] | default([]) }}"
      separators: "{{ opnsense_test_area['separators'] | default({}) }}"
      secret_fields: "{{ opnsense_test_area['secret_fields'] | default([]) }}"
      actions: "{{ opnsense_test_area['actions'] | default({}) }}"
      apply: "{{ opnsense_test_area['apply'] | default(none) }}"
  vars:
    opnsense_test_area: "{{ opnsense_areas['nodeexporter_general'] }}"
    opnsense_test_skip_missing_plugin: >-
      {{ opnsense_test_area['plugin'] is defined
         and lookup('ansible.builtin.env', 'OPNSENSE_SKIP_MISSING_PLUGINS', default='0') | bool }}
    opnsense_test_wanted:
      enabled: true
      listenport: 9101
      cpu: true
  tasks:
    - name: Read the original settings
      routerops.opnsense.settings:
        fields: "{{ opnsense_test_wanted }}"
      check_mode: true
      register: opnsense_test_original
      failed_when:
        - opnsense_test_original['failed'] | default(false)
        - not (opnsense_test_skip_missing_plugin | bool and opnsense_test_original['msg'] | default('') is search('the area or its plugin may be missing'))

    - name: Report the missing plugin
      ansible.builtin.debug:
        msg: "Skipping the test: endpoint not found, plugin {{ opnsense_test_area['plugin'] }} may be missing"
        verbosity: 0
      when:
        - opnsense_test_skip_missing_plugin | bool
        - opnsense_test_original['msg'] | default('') is search('the area or its plugin may be missing')

    - name: End the play without the plugin
      ansible.builtin.meta: end_play
      when:
        - opnsense_test_skip_missing_plugin | bool
        - opnsense_test_original['msg'] | default('') is search('the area or its plugin may be missing')

    - name: Set the wanted settings
      routerops.opnsense.settings:
        fields: "{{ opnsense_test_wanted }}"
      register: opnsense_test_first

    - name: Set the same settings again
      routerops.opnsense.settings:
        fields: "{{ opnsense_test_wanted }}"
      register: opnsense_test_second

    - name: Set the same settings in check mode
      routerops.opnsense.settings:
        fields: "{{ opnsense_test_wanted }}"
      check_mode: true
      register: opnsense_test_check

    - name: Set an invalid port
      routerops.opnsense.settings:
        fields:
          listenport: 70000
      register: opnsense_test_invalid
      ignore_errors: true

    - name: Assert the results
      ansible.builtin.assert:
        that:
          - opnsense_test_first['changed'] == (opnsense_test_original['settings'] != opnsense_test_wanted)
          - not opnsense_test_second['changed']
          - not opnsense_test_check['changed']
          - opnsense_test_invalid['failed']
          - opnsense_test_invalid['validations'] is defined

    - name: Run each catalog example twice in a row
      routerops.opnsense.settings:
        fields: "{{ item[0]['fields'] }}"
      loop: "{{ opnsense_test_area['examples'] | product([1, 2]) | list }}"
      loop_control:
        label: "{{ item[0]['name'] }} ({{ item[1] }})"
      register: opnsense_test_examples

    - name: Assert that no second example run changed anything
      ansible.builtin.assert:
        that:
          - opnsense_test_examples['results'] | selectattr('item.1', '==', 2) | selectattr('changed') | list | length == 0

    - name: Restore the original settings
      routerops.opnsense.settings:
        fields: "{{ opnsense_test_original['settings'] }}"
