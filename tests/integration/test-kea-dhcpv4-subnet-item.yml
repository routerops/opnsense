---
- name: Test the item module against Kea DHCPv4 subnets
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../meta/areas.yml
  module_defaults:
    routerops.opnsense.item:
      path: "{{ opnsense_test_area['path'] }}"
      key: "{{ opnsense_test_area['key'] }}"
      lookup: "{{ opnsense_test_area['lookup'] }}"
      actions: "{{ opnsense_test_area['actions'] | default({}) }}"
      separators: "{{ opnsense_test_area['separators'] | default({}) }}"
      secret_fields: "{{ opnsense_test_area['secret_fields'] | default([]) }}"
      ordered_fields: "{{ opnsense_test_area['ordered_fields'] | default([]) }}"
      always_send: "{{ opnsense_test_area['always_send'] | default([]) }}"
      apply: "{{ opnsense_test_area['apply'] | default(none) }}"
  vars:
    opnsense_test_area: "{{ opnsense_areas['kea_dhcpv4_subnet'] }}"
    opnsense_test_general_area: "{{ opnsense_areas['kea_dhcpv4_general'] }}"
    opnsense_test_one:
      subnet: 10.250.60.0/24
      pools: [10.250.60.100-10.250.60.199]
      description: routerops test one
    opnsense_test_two:
      subnet: 10.250.1.0/24
      pools: [10.250.1.100-10.250.1.199]
      description: routerops test two
  tasks:
    - name: Read the original default lease time
      routerops.opnsense.settings:
        path: "{{ opnsense_test_general_area['path'] }}"
        key: "{{ opnsense_test_general_area['key'] }}"
        fields:
          valid_lifetime: 4000
      check_mode: true
      register: opnsense_test_general_original

    - name: Run the subnet tests
      block:
        - name: Add the first subnet in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
          check_mode: true
          register: opnsense_test_check_add

        - name: Add both subnets
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_add

        - name: Change the default lease time so OPNsense collects the subnet options
          routerops.opnsense.settings:
            path: "{{ opnsense_test_general_area['path'] }}"
            key: "{{ opnsense_test_general_area['key'] }}"
            apply: "{{ opnsense_test_general_area['apply'] }}"
            fields:
              valid_lifetime: "{{ opnsense_test_general_original['settings']['valid_lifetime'] | int + 1 }}"
          register: opnsense_test_general_write

        - name: Add both subnets again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_again

        - name: Add both subnets again in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          check_mode: true
          register: opnsense_test_again_check

        - name: Read the collected router option of the LAN subnet
          routerops.opnsense.item:
            return_fields: [option_data.routers]
            items:
              - fields: "{{ opnsense_test_two }}"
                state: query
          register: opnsense_test_collected

        - name: Change the lease time of the first subnet
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'valid_lifetime': 3600}) }}"
          register: opnsense_test_update

        - name: Change the lease time of the first subnet again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'valid_lifetime': 3600}) }}"
          register: opnsense_test_update_again

        - name: Remove both subnets
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent
          register: opnsense_test_delete

        - name: Add a subnet with an invalid prefix length
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'subnet': '10.250.60.0/33'}) }}"
          register: opnsense_test_invalid
          ignore_errors: true

        - name: Assert the results
          ansible.builtin.assert:
            that:
              - opnsense_test_check_add['changed']
              - opnsense_test_check_add['outcomes'][0]['uuid'] is none
              - opnsense_test_add['changed']
              - opnsense_test_add['outcomes'] | map(attribute='action') | list == ['added', 'added']
              - opnsense_test_add['outcomes'] | map(attribute='uuid') | select | list | length == 2
              - opnsense_test_general_write['changed']
              - not opnsense_test_again['changed']
              - not opnsense_test_again_check['changed']
              - opnsense_test_collected['outcomes'][0]['fields']['option_data.routers'] | length > 0
              - opnsense_test_update['changed']
              - opnsense_test_update['outcomes'][0]['action'] == 'updated'
              - opnsense_test_update['outcomes'][0]['uuid'] == opnsense_test_add['outcomes'][0]['uuid']
              - not opnsense_test_update_again['changed']
              - opnsense_test_delete['changed']
              - opnsense_test_delete['outcomes'] | map(attribute='action') | list == ['deleted', 'deleted']
              - opnsense_test_invalid['failed']
              - "'subnet4.subnet' in opnsense_test_invalid['validations']"

        - name: Run each catalog example twice in a row
          routerops.opnsense.item:
            return_fields: "{{ item[0]['return_fields'] | default([]) }}"
            items: "{{ item[0]['items'] }}"
          loop: "{{ opnsense_test_area['examples'] | product([1, 2]) | list }}"
          loop_control:
            label: "{{ item[0]['name'] }} ({{ item[1] }})"
          register: opnsense_test_examples

        - name: Assert that no second example run changed anything
          ansible.builtin.assert:
            that:
              - opnsense_test_examples['results'] | selectattr('item.1', '==', 2) | selectattr('changed') | list | length == 0
      always:
        - name: Restore the original default lease time
          routerops.opnsense.settings:
            path: "{{ opnsense_test_general_area['path'] }}"
            key: "{{ opnsense_test_general_area['key'] }}"
            apply: "{{ opnsense_test_general_area['apply'] }}"
            fields: "{{ opnsense_test_general_original['settings'] }}"

        - name: Remove both test subnets
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent

        - name: Remove the catalog examples
          routerops.opnsense.item:
            items: >-
              {{ ((item['items'] | rejectattr('state', 'defined') | list)
                  + (item['items'] | selectattr('state', 'defined') | rejectattr('state', 'equalto', 'query') | list))
                 | map('combine', {'state': 'absent'}) | list }}
          loop: "{{ opnsense_test_area['examples'] }}"
          loop_control:
            label: "{{ item['name'] }}"

        - name: Look up the subnets after the cleanup
          routerops.opnsense.item:
            items: >-
              {{ ([{'fields': opnsense_test_one}, {'fields': opnsense_test_two}] + opnsense_test_area['examples'][0]['items'])
                 | map('combine', {'state': 'query'}) | list }}
          register: opnsense_test_left

        - name: Assert that the cleanup removed every subnet
          ansible.builtin.assert:
            that:
              - opnsense_test_left['outcomes'] | map(attribute='uuid') | select | list | length == 0
