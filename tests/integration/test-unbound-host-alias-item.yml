---
- name: Test the item module against Unbound host aliases
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../meta/areas.yml
  module_defaults:
    group/routerops.opnsense.opnsense:
      path: "{{ opnsense_test_area['path'] }}"
      key: "{{ opnsense_test_area['key'] }}"
      lookup: "{{ opnsense_test_area['lookup'] }}"
      actions: "{{ opnsense_test_area['actions'] | default({}) }}"
      separators: "{{ opnsense_test_area['separators'] | default({}) }}"
      secret_fields: "{{ opnsense_test_area['secret_fields'] | default([]) }}"
      ordered_fields: "{{ opnsense_test_area['ordered_fields'] | default([]) }}"
      always_send: "{{ opnsense_test_area['always_send'] | default([]) }}"
      apply: "{{ opnsense_test_area['apply'] | default(none) }}"
  vars:
    opnsense_test_area: "{{ opnsense_areas['unbound_host_alias'] }}"
    opnsense_test_host_area: "{{ opnsense_areas['unbound_host_override'] }}"
    opnsense_test_hosts:
      - fields:
          hostname: rt-test-one
          domain: routerops.test
          rr: A
          server: 10.250.1.20
          description: routerops test one
      - fields: "{{ opnsense_test_host_area['examples'][0]['items'][0]['fields'] }}"
    opnsense_test_host_uuid: "{{ opnsense_test_host_add['outcomes'][0]['uuid'] }}"
    opnsense_test_example_host_uuid: "{{ opnsense_test_host_add['outcomes'][1]['uuid'] }}"
    opnsense_test_one:
      host: "{{ opnsense_test_host_uuid }}"
      hostname: rt-test-one-a
      domain: ""
      description: routerops test one
    opnsense_test_two:
      host: "{{ opnsense_test_host_uuid }}"
      hostname: rt-test-one-b
      domain: ""
      description: routerops test two
    opnsense_test_domains:
      - fields:
          host: "{{ opnsense_test_host_uuid }}"
          hostname: ""
          domain: a.routerops.test
          description: routerops test domain a
      - fields:
          host: "{{ opnsense_test_host_uuid }}"
          hostname: ""
          domain: b.routerops.test
          description: routerops test domain b
    opnsense_test_examples: >-
      {{ opnsense_test_area['examples'] | to_json
         | replace('EXAMPLE_HOST_UUID', opnsense_test_example_host_uuid) | from_json }}
  tasks:
    - name: Run the host alias tests
      block:
        - name: Add the host overrides the aliases use
          routerops.opnsense.item:
            path: "{{ opnsense_test_host_area['path'] }}"
            key: "{{ opnsense_test_host_area['key'] }}"
            lookup: "{{ opnsense_test_host_area['lookup'] }}"
            actions: "{{ opnsense_test_host_area['actions'] }}"
            apply: "{{ opnsense_test_host_area['apply'] }}"
            items: "{{ opnsense_test_hosts }}"
          register: opnsense_test_host_add

        - name: Add the first alias in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
          check_mode: true
          register: opnsense_test_check_add

        - name: Add both aliases
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_add

        - name: Add both aliases again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_again

        - name: Add both aliases again in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          check_mode: true
          register: opnsense_test_again_check

        - name: Add two aliases that only set a domain
          routerops.opnsense.item:
            items: "{{ opnsense_test_domains }}"
          register: opnsense_test_domains_add

        - name: Add the two domain aliases again
          routerops.opnsense.item:
            items: "{{ opnsense_test_domains }}"
          register: opnsense_test_domains_again

        - name: Remove the two domain aliases
          routerops.opnsense.item:
            items: "{{ opnsense_test_domains | map('combine', {'state': 'absent'}) | list }}"
          register: opnsense_test_domains_delete

        - name: Change the description of the first alias
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'description': 'routerops test changed'}) }}"
          register: opnsense_test_update

        - name: Change the description of the first alias again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'description': 'routerops test changed'}) }}"
          register: opnsense_test_update_again

        - name: Remove both aliases
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent
          register: opnsense_test_delete

        - name: Add an alias on an unknown host
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'host': '00000000-0000-4000-8000-000000000000'}) }}"
          register: opnsense_test_invalid
          ignore_errors: true

        - name: Assert the results
          ansible.builtin.assert:
            that:
              - opnsense_test_check_add['changed']
              - opnsense_test_check_add['outcomes'][0]['uuid'] is none
              - opnsense_test_add['changed']
              - opnsense_test_add['outcomes'] | map(attribute='action') | list == ['added', 'added']
              - opnsense_test_add['outcomes'] | map(attribute='uuid') | select | list | length == 2
              - not opnsense_test_again['changed']
              - not opnsense_test_again_check['changed']
              - opnsense_test_domains_add['outcomes'] | map(attribute='action') | list == ['added', 'added']
              - not opnsense_test_domains_again['changed']
              - opnsense_test_domains_delete['outcomes'] | map(attribute='action') | list == ['deleted', 'deleted']
              - opnsense_test_update['changed']
              - opnsense_test_update['outcomes'][0]['action'] == 'updated'
              - opnsense_test_update['outcomes'][0]['uuid'] == opnsense_test_add['outcomes'][0]['uuid']
              - not opnsense_test_update_again['changed']
              - opnsense_test_delete['changed']
              - opnsense_test_delete['outcomes'] | map(attribute='action') | list == ['deleted', 'deleted']
              - opnsense_test_invalid['failed']
              - "'alias.host' in opnsense_test_invalid['validations']"

        - name: Run each catalog example twice in a row
          routerops.opnsense.item:
            return_fields: "{{ item[0]['return_fields'] | default([]) }}"
            items: "{{ item[0]['items'] }}"
          loop: "{{ opnsense_test_examples | product([1, 2]) | list }}"
          loop_control:
            label: "{{ item[0]['name'] }} ({{ item[1] }})"
          register: opnsense_test_examples_run

        - name: Assert that no second example run changed anything
          ansible.builtin.assert:
            that:
              - opnsense_test_examples_run['results'] | selectattr('item.1', '==', 2) | selectattr('changed') | list | length == 0
      always:
        - name: Remove both test aliases and the example alias
          routerops.opnsense.item:
            items: >-
              {{ ([{'fields': opnsense_test_one}, {'fields': opnsense_test_two}] + opnsense_test_domains + opnsense_test_examples[0]['items'])
                 | map('combine', {'state': 'absent'}) | list }}
          when: opnsense_test_host_add['outcomes'] is defined

        - name: Remove the host overrides
          routerops.opnsense.item:
            path: "{{ opnsense_test_host_area['path'] }}"
            key: "{{ opnsense_test_host_area['key'] }}"
            lookup: "{{ opnsense_test_host_area['lookup'] }}"
            actions: "{{ opnsense_test_host_area['actions'] }}"
            apply: "{{ opnsense_test_host_area['apply'] }}"
            items: "{{ opnsense_test_hosts | map('combine', {'state': 'absent'}) | list }}"

        - name: Look up the aliases after the cleanup
          routerops.opnsense.item:
            items: >-
              {{ ([{'fields': opnsense_test_one}, {'fields': opnsense_test_two}] + opnsense_test_domains + opnsense_test_examples[0]['items'])
                 | map('combine', {'state': 'query'}) | list }}
          register: opnsense_test_left
          when: opnsense_test_host_add['outcomes'] is defined

        - name: Look up the host overrides after the cleanup
          routerops.opnsense.item:
            path: "{{ opnsense_test_host_area['path'] }}"
            key: "{{ opnsense_test_host_area['key'] }}"
            lookup: "{{ opnsense_test_host_area['lookup'] }}"
            actions: "{{ opnsense_test_host_area['actions'] }}"
            items: "{{ opnsense_test_hosts | map('combine', {'state': 'query'}) | list }}"
          register: opnsense_test_hosts_left

        - name: Assert that the cleanup removed every alias and host override
          ansible.builtin.assert:
            that:
              - opnsense_test_left['outcomes'] | default([]) | map(attribute='uuid') | select | list | length == 0
              - opnsense_test_hosts_left['outcomes'] | map(attribute='uuid') | select | list | length == 0
