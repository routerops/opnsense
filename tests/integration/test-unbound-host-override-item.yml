---
- name: Test the item module against Unbound host overrides
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../meta/areas.yml
  module_defaults:
    group/routerops.opnsense.opnsense:
      path: "{{ opnsense_test_area['path'] }}"
      key: "{{ opnsense_test_area['key'] }}"
      lookup: "{{ opnsense_test_area['lookup'] }}"
      actions: "{{ opnsense_test_area['actions'] | default({}) }}"
      separators: "{{ opnsense_test_area['separators'] | default({}) }}"
      secret_fields: "{{ opnsense_test_area['secret_fields'] | default([]) }}"
      ordered_fields: "{{ opnsense_test_area['ordered_fields'] | default([]) }}"
      always_send: "{{ opnsense_test_area['always_send'] | default([]) }}"
      apply: "{{ opnsense_test_area['apply'] | default(none) }}"
  vars:
    opnsense_test_area: "{{ opnsense_areas['unbound_host_override'] }}"
    opnsense_test_one:
      hostname: rt-test-one
      domain: routerops.test
      rr: A
      server: 10.250.1.20
      description: routerops test one
    opnsense_test_two:
      hostname: rt-test-two
      domain: routerops.test
      rr: A
      server: 10.250.1.21
      description: routerops test two
    opnsense_test_aaaa: "{{ opnsense_test_one | combine({'rr': 'AAAA', 'server': 'fd00:250::20'}) }}"
  tasks:
    - name: Run the host override tests
      block:
        - name: Add the first host override in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
          check_mode: true
          register: opnsense_test_check_add

        - name: Add both host overrides
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_add

        - name: Add both host overrides again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_again

        - name: Add both host overrides again in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          check_mode: true
          register: opnsense_test_again_check

        - name: Add an AAAA record for the first name
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_aaaa }}"
          register: opnsense_test_aaaa_add

        - name: Add the A and AAAA records for the first name again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_aaaa }}"
          register: opnsense_test_aaaa_again

        - name: Remove the AAAA record for the first name
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_aaaa }}"
                state: absent
          register: opnsense_test_aaaa_delete

        - name: Change the address of the first host override
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'server': '10.250.1.22'}) }}"
          register: opnsense_test_update

        - name: Change the address of the first host override again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'server': '10.250.1.22'}) }}"
          register: opnsense_test_update_again

        - name: Remove both host overrides
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent
          register: opnsense_test_delete

        - name: Add a host override whose name ends in a dot
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'hostname': 'rt-test-one.'}) }}"
          register: opnsense_test_invalid
          ignore_errors: true

        - name: Assert the results
          ansible.builtin.assert:
            that:
              - opnsense_test_check_add['changed']
              - opnsense_test_check_add['outcomes'][0]['uuid'] is none
              - opnsense_test_add['changed']
              - opnsense_test_add['outcomes'] | map(attribute='action') | list == ['added', 'added']
              - opnsense_test_add['outcomes'] | map(attribute='uuid') | select | list | length == 2
              - not opnsense_test_again['changed']
              - not opnsense_test_again_check['changed']
              - opnsense_test_aaaa_add['outcomes'] | map(attribute='action') | list == ['unchanged', 'added']
              - not opnsense_test_aaaa_again['changed']
              - opnsense_test_aaaa_delete['outcomes'][0]['action'] == 'deleted'
              - opnsense_test_update['changed']
              - opnsense_test_update['outcomes'][0]['action'] == 'updated'
              - opnsense_test_update['outcomes'][0]['uuid'] == opnsense_test_add['outcomes'][0]['uuid']
              - not opnsense_test_update_again['changed']
              - opnsense_test_delete['changed']
              - opnsense_test_delete['outcomes'] | map(attribute='action') | list == ['deleted', 'deleted']
              - opnsense_test_invalid['failed']
              - "'host.hostname' in opnsense_test_invalid['validations']"

        - name: Run each catalog example twice in a row
          routerops.opnsense.item:
            return_fields: "{{ item[0]['return_fields'] | default([]) }}"
            items: "{{ item[0]['items'] }}"
          loop: "{{ opnsense_test_area['examples'] | product([1, 2]) | list }}"
          loop_control:
            label: "{{ item[0]['name'] }} ({{ item[1] }})"
          register: opnsense_test_examples

        - name: Assert that no second example run changed anything
          ansible.builtin.assert:
            that:
              - opnsense_test_examples['results'] | selectattr('item.1', '==', 2) | selectattr('changed') | list | length == 0
      always:
        - name: Remove both test host overrides
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent
              - fields: "{{ opnsense_test_aaaa }}"
                state: absent

        - name: Remove the catalog examples
          routerops.opnsense.item:
            items: >-
              {{ ((item['items'] | rejectattr('state', 'defined') | list)
                  + (item['items'] | selectattr('state', 'defined') | rejectattr('state', 'equalto', 'query') | list))
                 | map('combine', {'state': 'absent'}) | list }}
          loop: "{{ opnsense_test_area['examples'] }}"
          loop_control:
            label: "{{ item['name'] }}"

        - name: Look up the host overrides after the cleanup
          routerops.opnsense.item:
            items: >-
              {{ ([{'fields': opnsense_test_one}, {'fields': opnsense_test_two}, {'fields': opnsense_test_aaaa}] + opnsense_test_area['examples'][0]['items'])
                 | map('combine', {'state': 'query'}) | list }}
          register: opnsense_test_left

        - name: Assert that the cleanup removed every host override
          ansible.builtin.assert:
            that:
              - opnsense_test_left['outcomes'] | map(attribute='uuid') | select | list | length == 0
