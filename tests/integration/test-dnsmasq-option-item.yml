---
- name: Test the item module against Dnsmasq DHCP options
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../meta/areas.yml
  module_defaults:
    group/routerops.opnsense.opnsense:
      path: "{{ opnsense_test_area['path'] }}"
      key: "{{ opnsense_test_area['key'] }}"
      lookup: "{{ opnsense_test_area['lookup'] }}"
      actions: "{{ opnsense_test_area['actions'] | default({}) }}"
      separators: "{{ opnsense_test_area['separators'] | default({}) }}"
      secret_fields: "{{ opnsense_test_area['secret_fields'] | default([]) }}"
      ordered_fields: "{{ opnsense_test_area['ordered_fields'] | default([]) }}"
      always_send: "{{ opnsense_test_area['always_send'] | default([]) }}"
      apply: "{{ opnsense_test_area['apply'] | default(none) }}"
  vars:
    opnsense_test_area: "{{ opnsense_areas['dnsmasq_option'] }}"
    opnsense_test_one:
      type: set
      option: "6"
      interface: lan
      value: 10.250.1.1
      description: routerops test one
    opnsense_test_two:
      type: set
      option: "42"
      interface: lan
      value: 10.250.1.1
      description: routerops test two
    opnsense_test_tag:
      tag: routerops_test
  tasks:
    - name: Run the option tests
      block:
        - name: Add the first option in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
          check_mode: true
          register: opnsense_test_check_add

        - name: Add both options
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_add

        - name: Add both options again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_again

        - name: Add both options again in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          check_mode: true
          register: opnsense_test_again_check

        - name: Add the tag the set_tag check uses
          routerops.opnsense.item:
            path: dnsmasq/settings
            key: tag
            lookup: [tag]
            actions: {search: searchTag, get: getTag, add: addTag, set: setTag, del: delTag}
            always_send: []
            items:
              - fields: "{{ opnsense_test_tag }}"
          register: opnsense_test_tag_add

        - name: Send a set_tag on a set-type option
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_two | combine({'set_tag': opnsense_test_tag_add['outcomes'][0]['uuid']}) }}"
          register: opnsense_test_set_tag

        - name: Send the set_tag on the set-type option again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_two | combine({'set_tag': opnsense_test_tag_add['outcomes'][0]['uuid']}) }}"
          register: opnsense_test_set_tag_again

        - name: Read the stored set_tag of the second option
          routerops.opnsense.item:
            return_fields: [set_tag]
            items:
              - fields: "{{ opnsense_test_two }}"
                state: query
          register: opnsense_test_set_tag_stored

        - name: Change the value of the first option
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'value': '10.250.1.2'}) }}"
          register: opnsense_test_update

        - name: Change the value of the first option again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'value': '10.250.1.2'}) }}"
          register: opnsense_test_update_again

        - name: Remove both options
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent
          register: opnsense_test_delete

        - name: Add an option with an invalid value
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'option': ''}) }}"
          register: opnsense_test_invalid
          ignore_errors: true

        - name: Assert the results
          ansible.builtin.assert:
            that:
              - opnsense_test_check_add['changed']
              - opnsense_test_check_add['outcomes'][0]['uuid'] is none
              - opnsense_test_add['changed']
              - opnsense_test_add['outcomes'] | map(attribute='action') | list == ['added', 'added']
              - opnsense_test_add['outcomes'] | map(attribute='uuid') | select | list | length == 2
              - not opnsense_test_again['changed']
              - not opnsense_test_again_check['changed']
              - opnsense_test_set_tag['changed']
              - opnsense_test_set_tag_stored['outcomes'][0]['fields']['set_tag'] == ''
              - opnsense_test_set_tag_again['changed']
              - opnsense_test_update['changed']
              - opnsense_test_update['outcomes'][0]['action'] == 'updated'
              - opnsense_test_update['outcomes'][0]['uuid'] == opnsense_test_add['outcomes'][0]['uuid']
              - not opnsense_test_update_again['changed']
              - opnsense_test_delete['changed']
              - opnsense_test_delete['outcomes'] | map(attribute='action') | list == ['deleted', 'deleted']
              - opnsense_test_invalid['failed']
              - "'option.option' in opnsense_test_invalid['validations']"

        - name: Run each catalog example twice in a row
          routerops.opnsense.item:
            return_fields: "{{ item[0]['return_fields'] | default([]) }}"
            items: "{{ item[0]['items'] }}"
          loop: "{{ opnsense_test_area['examples'] | product([1, 2]) | list }}"
          loop_control:
            label: "{{ item[0]['name'] }} ({{ item[1] }})"
          register: opnsense_test_examples

        - name: Assert that no second example run changed anything
          ansible.builtin.assert:
            that:
              - opnsense_test_examples['results'] | selectattr('item.1', '==', 2) | selectattr('changed') | list | length == 0
      always:
        - name: Remove both test options
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent

        - name: Remove the catalog examples
          routerops.opnsense.item:
            items: >-
              {{ ((item['items'] | rejectattr('state', 'defined') | list)
                  + (item['items'] | selectattr('state', 'defined') | rejectattr('state', 'equalto', 'query') | list))
                 | map('combine', {'state': 'absent'}) | list }}
          loop: "{{ opnsense_test_area['examples'] }}"
          loop_control:
            label: "{{ item['name'] }}"

        - name: Remove the set_tag test tag
          routerops.opnsense.item:
            path: dnsmasq/settings
            key: tag
            lookup: [tag]
            actions: {search: searchTag, get: getTag, add: addTag, set: setTag, del: delTag}
            always_send: []
            items:
              - fields: "{{ opnsense_test_tag }}"
                state: absent

        - name: Look up the options after the cleanup
          routerops.opnsense.item:
            items: >-
              {{ ([{'fields': opnsense_test_one}, {'fields': opnsense_test_two}] + opnsense_test_area['examples'][0]['items'])
                 | map('combine', {'state': 'query'}) | list }}
          register: opnsense_test_left

        - name: Look up the set_tag test tag after the cleanup
          routerops.opnsense.item:
            path: dnsmasq/settings
            key: tag
            lookup: [tag]
            actions: {search: searchTag, get: getTag, add: addTag, set: setTag, del: delTag}
            always_send: []
            items:
              - fields: "{{ opnsense_test_tag }}"
                state: query
          register: opnsense_test_tag_left

        - name: Assert that the cleanup removed every option and the tag
          ansible.builtin.assert:
            that:
              - opnsense_test_left['outcomes'] | map(attribute='uuid') | select | list | length == 0
              - opnsense_test_tag_left['outcomes'][0]['uuid'] is none
