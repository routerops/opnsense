---
- name: Test the item module against interface assignments
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../meta/areas.yml
  module_defaults:
    group/routerops.opnsense.opnsense:
      path: "{{ opnsense_test_area['path'] }}"
      key: "{{ opnsense_test_area['key'] }}"
      lookup: "{{ opnsense_test_area['lookup'] }}"
      id_format: "{{ opnsense_test_area['id_format'] | default('uuid') }}"
      actions: "{{ opnsense_test_area['actions'] | default({}) }}"
      separators: "{{ opnsense_test_area['separators'] | default({}) }}"
      secret_fields: "{{ opnsense_test_area['secret_fields'] | default([]) }}"
      ordered_fields: "{{ opnsense_test_area['ordered_fields'] | default([]) }}"
      always_send: "{{ opnsense_test_area['always_send'] | default([]) }}"
      apply: "{{ opnsense_test_area['apply'] | default(none) }}"
  vars:
    opnsense_test_area: "{{ opnsense_areas['interfaces_assignment'] }}"
    opnsense_test_vlan_area: "{{ opnsense_areas['interfaces_vlan'] }}"
    opnsense_test_vlans:
      - fields:
          if: vtnet1
          tag: 4001
          vlanif: vlan0.4001
          descr: routerops test one
      - fields:
          if: vtnet1
          tag: 4002
          vlanif: vlan0.4002
          descr: routerops test two
      - fields: "{{ opnsense_test_vlan_area['examples'][0]['items'][0]['fields'] }}"
    opnsense_test_one:
      if: vlan0.4001
      descr: rt_test_one
      enable: true
      lock: false
      type4: staticv4
      ipaddr: 10.250.40.1/24
      type6: ""
    opnsense_test_two:
      if: vlan0.4002
      descr: rt_test_two
      enable: true
      lock: false
      type4: staticv4
      ipaddr: 10.250.41.1/24
      type6: ""
  tasks:
    - name: Run the assignment tests
      block:
        - name: Add the VLANs the assignments use
          routerops.opnsense.item:
            path: "{{ opnsense_test_vlan_area['path'] }}"
            key: "{{ opnsense_test_vlan_area['key'] }}"
            lookup: "{{ opnsense_test_vlan_area['lookup'] }}"
            id_format: uuid
            apply: "{{ opnsense_test_vlan_area['apply'] }}"
            items: "{{ opnsense_test_vlans }}"

        - name: Add the first assignment in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
          check_mode: true
          register: opnsense_test_check_add

        - name: Add both assignments
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_add

        - name: Add both assignments again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_again

        - name: Add both assignments again in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          check_mode: true
          register: opnsense_test_again_check

        - name: Change the address of the first assignment
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'ipaddr': '10.250.40.2/24'}) }}"
          register: opnsense_test_update

        - name: Change the address of the first assignment again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'ipaddr': '10.250.40.2/24'}) }}"
          register: opnsense_test_update_again

        - name: Remove both assignments
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent
          register: opnsense_test_delete

        - name: Add a static assignment without an address
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'ipaddr': ''}) }}"
          register: opnsense_test_invalid
          ignore_errors: true

        - name: Assert the results
          ansible.builtin.assert:
            that:
              - opnsense_test_check_add['changed']
              - opnsense_test_check_add['outcomes'][0]['uuid'] is none
              - opnsense_test_add is not failed
              - opnsense_test_add['changed']
              - opnsense_test_add['outcomes'] | map(attribute='action') | list == ['added', 'added']
              - opnsense_test_add['outcomes'] | map(attribute='uuid') | select('match', '^opt[0-9]+$') | list | length == 2
              - not opnsense_test_again['changed']
              - not opnsense_test_again_check['changed']
              - opnsense_test_update['changed']
              - opnsense_test_update['outcomes'][0]['action'] == 'updated'
              - opnsense_test_update['outcomes'][0]['uuid'] == opnsense_test_add['outcomes'][0]['uuid']
              - not opnsense_test_update_again['changed']
              - opnsense_test_delete['changed']
              - opnsense_test_delete['outcomes'] | map(attribute='action') | list == ['deleted', 'deleted']
              - opnsense_test_invalid['failed']
              - "'interface.ipaddr' in opnsense_test_invalid['validations']"

        - name: Run each catalog example twice in a row
          routerops.opnsense.item:
            return_fields: "{{ item[0]['return_fields'] | default([]) }}"
            items: "{{ item[0]['items'] }}"
          loop: "{{ opnsense_test_area['examples'] | product([1, 2]) | list }}"
          loop_control:
            label: "{{ item[0]['name'] }} ({{ item[1] }})"
          register: opnsense_test_examples

        - name: Assert that no second example run changed anything
          ansible.builtin.assert:
            that:
              - opnsense_test_examples['results'] | selectattr('item.1', '==', 2) | selectattr('changed') | list | length == 0
      always:
        - name: Remove both test assignments
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent

        - name: Remove the catalog examples
          routerops.opnsense.item:
            items: >-
              {{ ((item['items'] | rejectattr('state', 'defined') | list)
                  + (item['items'] | selectattr('state', 'defined') | rejectattr('state', 'equalto', 'query') | list))
                 | map('combine', {'state': 'absent'}) | list }}
          loop: "{{ opnsense_test_area['examples'] }}"
          loop_control:
            label: "{{ item['name'] }}"

        - name: Remove the test VLANs
          routerops.opnsense.item:
            path: "{{ opnsense_test_vlan_area['path'] }}"
            key: "{{ opnsense_test_vlan_area['key'] }}"
            lookup: "{{ opnsense_test_vlan_area['lookup'] }}"
            id_format: uuid
            apply: "{{ opnsense_test_vlan_area['apply'] }}"
            items: "{{ opnsense_test_vlans | map('combine', {'state': 'absent'}) | list }}"

        - name: Look up the assignments and VLANs after the cleanup
          routerops.opnsense.item:
            items: >-
              {{ ([{'fields': opnsense_test_one}, {'fields': opnsense_test_two}] + opnsense_test_area['examples'][0]['items'])
                 | map('combine', {'state': 'query'}) | list }}
          register: opnsense_test_left

        - name: Look up the test VLANs after the cleanup
          routerops.opnsense.item:
            path: "{{ opnsense_test_vlan_area['path'] }}"
            key: "{{ opnsense_test_vlan_area['key'] }}"
            lookup: "{{ opnsense_test_vlan_area['lookup'] }}"
            id_format: uuid
            items: "{{ opnsense_test_vlans | map('combine', {'state': 'query'}) | list }}"
          register: opnsense_test_vlans_left

        - name: Assert that the cleanup removed every assignment and VLAN
          ansible.builtin.assert:
            that:
              - opnsense_test_left['outcomes'] | map(attribute='uuid') | select | list | length == 0
              - opnsense_test_vlans_left['outcomes'] | map(attribute='uuid') | select | list | length == 0
