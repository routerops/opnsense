---
- name: Test the settings module against the outbound NAT mode
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../meta/areas.yml
  module_defaults:
    group/routerops.opnsense.opnsense:
      path: "{{ opnsense_test_area['path'] }}"
      key: "{{ opnsense_test_area['key'] }}"
      ordered_fields: "{{ opnsense_test_area['ordered_fields'] | default([]) }}"
      separators: "{{ opnsense_test_area['separators'] | default({}) }}"
      secret_fields: "{{ opnsense_test_area['secret_fields'] | default([]) }}"
      actions: "{{ opnsense_test_area['actions'] | default({}) }}"
      apply: "{{ opnsense_test_area['apply'] | default(none) }}"
  vars:
    opnsense_test_area: "{{ opnsense_areas['firewall_source_nat_general'] }}"
    opnsense_test_wanted:
      snat_mode: hybrid
  tasks:
    - name: Read the original outbound NAT mode
      routerops.opnsense.settings:
        fields: "{{ opnsense_test_wanted }}"
      check_mode: true
      register: opnsense_test_original

    - name: Run the outbound NAT mode tests
      block:
        - name: Set the hybrid mode
          routerops.opnsense.settings:
            fields: "{{ opnsense_test_wanted }}"
          register: opnsense_test_first

        - name: Set the hybrid mode again
          routerops.opnsense.settings:
            fields: "{{ opnsense_test_wanted }}"
          register: opnsense_test_second

        - name: Set the hybrid mode in check mode
          routerops.opnsense.settings:
            fields: "{{ opnsense_test_wanted }}"
          check_mode: true
          register: opnsense_test_check

        - name: Set the advanced mode
          routerops.opnsense.settings:
            fields:
              snat_mode: advanced
          register: opnsense_test_advanced

        - name: Set an unknown mode
          routerops.opnsense.settings:
            fields:
              snat_mode: routerops-invalid
          register: opnsense_test_invalid
          ignore_errors: true

        - name: Assert the results
          ansible.builtin.assert:
            that:
              - opnsense_test_first['changed'] == (opnsense_test_original['settings']['snat_mode'] != 'hybrid')
              - not opnsense_test_second['changed']
              - not opnsense_test_check['changed']
              - opnsense_test_advanced['changed']
              - opnsense_test_invalid['failed']
              - opnsense_test_invalid['validations'] is defined

        - name: Run each catalog example twice in a row
          routerops.opnsense.settings:
            fields: "{{ item[0]['fields'] }}"
          loop: "{{ opnsense_test_area['examples'] | product([1, 2]) | list }}"
          loop_control:
            label: "{{ item[0]['name'] }} ({{ item[1] }})"
          register: opnsense_test_examples

        - name: Assert that no second example run changed anything
          ansible.builtin.assert:
            that:
              - opnsense_test_examples['results'] | selectattr('item.1', '==', 2) | selectattr('changed') | list | length == 0
      always:
        - name: Restore the original outbound NAT mode
          routerops.opnsense.settings:
            fields:
              snat_mode: "{{ opnsense_test_original['settings']['snat_mode'] }}"
