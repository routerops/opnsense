---
- name: Test the item module against static routes
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../meta/areas.yml
  module_defaults:
    group/routerops.opnsense.opnsense:
      path: "{{ opnsense_test_area['path'] }}"
      key: "{{ opnsense_test_area['key'] }}"
      lookup: "{{ opnsense_test_area['lookup'] }}"
      actions: "{{ opnsense_test_area['actions'] | default({}) }}"
      separators: "{{ opnsense_test_area['separators'] | default({}) }}"
      secret_fields: "{{ opnsense_test_area['secret_fields'] | default([]) }}"
      ordered_fields: "{{ opnsense_test_area['ordered_fields'] | default([]) }}"
      always_send: "{{ opnsense_test_area['always_send'] | default([]) }}"
      apply: "{{ opnsense_test_area['apply'] | default(none) }}"
  vars:
    opnsense_test_area: "{{ opnsense_areas['routes_static_route'] }}"
    opnsense_test_gateway_area: "{{ opnsense_areas['routing_gateway'] }}"
    opnsense_test_uuid_regex: !unsafe '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    opnsense_test_gateway:
      name: RT_EXAMPLE_GW
      interface: lan
      gateway: 10.250.1.254
      descr: routerops test
    opnsense_test_one:
      network: 10.98.0.0/24
      gateway: RT_EXAMPLE_GW
      descr: routerops test one
    opnsense_test_two:
      network: 10.98.1.0/24
      gateway: RT_EXAMPLE_GW
      descr: routerops test two
  tasks:
    - name: Run the static route tests
      block:
        - name: Add the gateway the routes use
          routerops.opnsense.item:
            path: "{{ opnsense_test_gateway_area['path'] }}"
            key: "{{ opnsense_test_gateway_area['key'] }}"
            lookup: "{{ opnsense_test_gateway_area['lookup'] }}"
            actions: "{{ opnsense_test_gateway_area['actions'] }}"
            apply: "{{ opnsense_test_gateway_area['apply'] }}"
            items:
              - fields: "{{ opnsense_test_gateway }}"

        - name: Wait for the cached gateway list to expire before the first route
          ansible.builtin.pause:
            seconds: 21

        - name: Add the first route in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
          check_mode: true
          register: opnsense_test_check_add

        - name: Add both routes
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_add

        - name: Add both routes again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_again

        - name: Add both routes again in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          check_mode: true
          register: opnsense_test_again_check

        - name: Purge every other route in check mode
          routerops.opnsense.item:
            purge: true
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          check_mode: true
          register: opnsense_test_purge_check

        - name: Change the description of the first route
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'descr': 'routerops test changed'}) }}"
          register: opnsense_test_update

        - name: Remove both routes
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent
          register: opnsense_test_delete

        - name: Add a route whose network has no prefix length
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'network': '10.98.2.0'}) }}"
          register: opnsense_test_invalid
          ignore_errors: true

        - name: Assert the results
          ansible.builtin.assert:
            that:
              - opnsense_test_check_add['changed']
              - opnsense_test_check_add['outcomes'][0]['uuid'] is none
              - opnsense_test_add is not failed
              - opnsense_test_add['changed']
              - opnsense_test_add['outcomes'] | map(attribute='action') | list == ['added', 'added']
              - opnsense_test_add['outcomes'] | map(attribute='uuid') | select | list | length == 2
              - not opnsense_test_again['changed']
              - not opnsense_test_again_check['changed']
              - opnsense_test_purge_check['purged'] | reject('match', opnsense_test_uuid_regex) | list == []
              - opnsense_test_update['changed']
              - opnsense_test_update['outcomes'][0]['action'] == 'updated'
              - opnsense_test_update['outcomes'][0]['uuid'] == opnsense_test_add['outcomes'][0]['uuid']
              - opnsense_test_delete['changed']
              - opnsense_test_delete['outcomes'] | map(attribute='action') | list == ['deleted', 'deleted']
              - opnsense_test_invalid['failed']
              - opnsense_test_invalid['validations'] is defined

        - name: Run each catalog example twice in a row
          routerops.opnsense.item:
            purge: "{{ item[0]['purge'] | default(false) }}"
            return_fields: "{{ item[0]['return_fields'] | default([]) }}"
            items: "{{ item[0]['items'] }}"
          loop: "{{ opnsense_test_area['examples'] | product([1, 2]) | list }}"
          loop_control:
            label: "{{ item[0]['name'] }} ({{ item[1] }})"
          register: opnsense_test_examples

        - name: Assert that no second example run changed anything
          ansible.builtin.assert:
            that:
              - opnsense_test_examples['results'] | selectattr('item.1', '==', 2) | selectattr('changed') | list | length == 0
      always:
        - name: Remove both test routes
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent

        - name: Remove the catalog examples
          routerops.opnsense.item:
            items: >-
              {{ ((item['items'] | rejectattr('state', 'defined') | list)
                  + (item['items'] | selectattr('state', 'defined') | rejectattr('state', 'equalto', 'query') | list))
                 | map('combine', {'state': 'absent'}) | list }}
          loop: "{{ opnsense_test_area['examples'] }}"
          loop_control:
            label: "{{ item['name'] }}"

        - name: Look up the catalog examples after the cleanup
          routerops.opnsense.item:
            items: >-
              {{ ((item['items'] | rejectattr('state', 'defined') | list)
                  + (item['items'] | selectattr('state', 'defined') | rejectattr('state', 'equalto', 'query') | list))
                 | map('combine', {'state': 'query'}) | list }}
          loop: "{{ opnsense_test_area['examples'] }}"
          loop_control:
            label: "{{ item['name'] }}"
          register: opnsense_test_examples_left

        - name: Remove the gateway after its routes
          routerops.opnsense.item:
            path: "{{ opnsense_test_gateway_area['path'] }}"
            key: "{{ opnsense_test_gateway_area['key'] }}"
            lookup: "{{ opnsense_test_gateway_area['lookup'] }}"
            actions: "{{ opnsense_test_gateway_area['actions'] }}"
            apply: "{{ opnsense_test_gateway_area['apply'] }}"
            items:
              - fields: "{{ opnsense_test_gateway }}"
                state: absent

        - name: Look up the gateway after the cleanup
          routerops.opnsense.item:
            path: "{{ opnsense_test_gateway_area['path'] }}"
            key: "{{ opnsense_test_gateway_area['key'] }}"
            lookup: "{{ opnsense_test_gateway_area['lookup'] }}"
            actions: "{{ opnsense_test_gateway_area['actions'] }}"
            items:
              - fields: "{{ opnsense_test_gateway }}"
                state: query
          register: opnsense_test_gateway_left

        - name: Assert that the cleanup removed every catalog example and the gateway
          ansible.builtin.assert:
            that:
              - opnsense_test_examples_left['results'] | map(attribute='outcomes') | flatten | map(attribute='uuid') | select | list | length == 0
              - opnsense_test_gateway_left['outcomes'][0]['uuid'] is none
