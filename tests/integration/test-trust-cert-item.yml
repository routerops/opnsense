---
- name: Test the item module against Trust certificates
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../meta/areas.yml
  module_defaults:
    group/routerops.opnsense.opnsense:
      path: "{{ opnsense_test_area['path'] }}"
      key: "{{ opnsense_test_area['key'] }}"
      lookup: "{{ opnsense_test_area['lookup'] }}"
      actions: "{{ opnsense_test_area['actions'] | default({}) }}"
      separators: "{{ opnsense_test_area['separators'] | default({}) }}"
      secret_fields: "{{ opnsense_test_area['secret_fields'] | default([]) }}"
      ordered_fields: "{{ opnsense_test_area['ordered_fields'] | default([]) }}"
      always_send: "{{ opnsense_test_area['always_send'] | default([]) }}"
      apply: "{{ opnsense_test_area['apply'] | default(none) }}"
    ansible.builtin.uri:
      url_username: "{{ lookup('ansible.builtin.env', 'OPNSENSE_API_KEY') }}"
      url_password: "{{ lookup('ansible.builtin.env', 'OPNSENSE_API_SECRET') }}"
      force_basic_auth: true
      validate_certs: "{{ lookup('ansible.builtin.env', 'OPNSENSE_VALIDATE_CERTS') | default('true', true) | bool }}"
  vars:
    opnsense_test_area: "{{ opnsense_areas['trust_cert'] }}"
    opnsense_test_ca_area: "{{ opnsense_areas['trust_ca'] }}"
    opnsense_test_api: "{{ lookup('ansible.builtin.env', 'OPNSENSE_URL') }}/api/{{ opnsense_test_area['path'] }}"
    opnsense_test_cas:
      - fields:
          descr: routerops test ca
        write_only:
          action: internal
          commonname: routerops-test-ca
      - "{{ opnsense_test_ca_area['examples'][0]['items'][0] }}"
    opnsense_test_ca_refid: "{{ opnsense_test_ca_add['outcomes'][0]['fields']['refid'] }}"
    opnsense_test_example_ca_refid: "{{ opnsense_test_ca_add['outcomes'][1]['fields']['refid'] }}"
    opnsense_test_one:
      descr: routerops test server
      caref: "{{ opnsense_test_ca_refid }}"
    opnsense_test_two:
      descr: routerops test two
      caref: "{{ opnsense_test_ca_refid }}"
    opnsense_test_one_create:
      action: internal
      cert_type: server_cert
      commonname: rt-test-server
    opnsense_test_two_create:
      action: internal
      cert_type: server_cert
      commonname: rt-test-two
    opnsense_test_cert_names:
      - fields: {descr: routerops test server}
      - fields: {descr: routerops test two}
      - fields: {descr: routerops test changed}
      - fields: {descr: routerops example server}
    opnsense_test_ca_names:
      - fields: {descr: routerops test ca}
      - fields: {descr: routerops example ca}
    opnsense_test_examples: >-
      {{ opnsense_test_area['examples'] | to_json
         | replace('CA_REFID', opnsense_test_example_ca_refid) | from_json }}
  tasks:
    - name: Run the certificate tests
      block:
        - name: Add the CAs that sign the certificates
          routerops.opnsense.item:
            path: "{{ opnsense_test_ca_area['path'] }}"
            key: "{{ opnsense_test_ca_area['key'] }}"
            lookup: "{{ opnsense_test_ca_area['lookup'] }}"
            actions: "{{ opnsense_test_ca_area['actions'] }}"
            return_fields: [refid]
            items: "{{ opnsense_test_cas }}"
          register: opnsense_test_ca_add

        - name: Add the first certificate in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                write_only: "{{ opnsense_test_one_create }}"
          check_mode: true
          register: opnsense_test_check_add

        - name: Add both certificates
          routerops.opnsense.item:
            return_fields: [refid]
            items:
              - fields: "{{ opnsense_test_one }}"
                write_only: "{{ opnsense_test_one_create }}"
              - fields: "{{ opnsense_test_two }}"
                write_only: "{{ opnsense_test_two_create }}"
          register: opnsense_test_add

        - name: Read the first certificate before the rerun
          ansible.builtin.uri:
            url: "{{ opnsense_test_api }}/get/{{ opnsense_test_add['outcomes'][0]['uuid'] }}"
          register: opnsense_test_crt_before
          no_log: true

        - name: Add both certificates again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                write_only: "{{ opnsense_test_one_create }}"
              - fields: "{{ opnsense_test_two }}"
                write_only: "{{ opnsense_test_two_create }}"
          register: opnsense_test_again

        - name: Read the first certificate after the rerun
          ansible.builtin.uri:
            url: "{{ opnsense_test_api }}/get/{{ opnsense_test_add['outcomes'][0]['uuid'] }}"
          register: opnsense_test_crt_after
          no_log: true

        - name: Add both certificates again in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                write_only: "{{ opnsense_test_one_create }}"
              - fields: "{{ opnsense_test_two }}"
                write_only: "{{ opnsense_test_two_create }}"
          check_mode: true
          register: opnsense_test_again_check

        - name: Change the description of the second certificate
          routerops.opnsense.item:
            lookup: [refid]
            items:
              - fields:
                  refid: "{{ opnsense_test_add['outcomes'][1]['fields']['refid'] }}"
                  descr: routerops test changed
          register: opnsense_test_update

        - name: Change the description of the second certificate again
          routerops.opnsense.item:
            lookup: [refid]
            items:
              - fields:
                  refid: "{{ opnsense_test_add['outcomes'][1]['fields']['refid'] }}"
                  descr: routerops test changed
          register: opnsense_test_update_again

        - name: Remove both certificates
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields:
                  descr: routerops test changed
                state: absent
          register: opnsense_test_delete

        - name: Add a certificate signed by an unknown CA
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'caref': '0000000000000'}) }}"
                write_only: "{{ opnsense_test_one_create }}"
          register: opnsense_test_invalid
          ignore_errors: true

        - name: Assert the results
          ansible.builtin.assert:
            that:
              - opnsense_test_check_add['changed']
              - opnsense_test_check_add['outcomes'][0]['uuid'] is none
              - opnsense_test_add['changed']
              - opnsense_test_add['outcomes'] | map(attribute='action') | list == ['added', 'added']
              - not opnsense_test_again['changed']
              - opnsense_test_crt_before['json']['cert']['crt'] == opnsense_test_crt_after['json']['cert']['crt']
              - not opnsense_test_again_check['changed']
              - opnsense_test_update['changed']
              - opnsense_test_update['outcomes'][0]['action'] == 'updated'
              - opnsense_test_update['outcomes'][0]['uuid'] == opnsense_test_add['outcomes'][1]['uuid']
              - not opnsense_test_update_again['changed']
              - opnsense_test_delete['outcomes'] | map(attribute='action') | list == ['deleted', 'deleted']
              - opnsense_test_invalid['failed']
              - not opnsense_test_invalid['changed']
              - "'cert.caref' in opnsense_test_invalid['validations']"

        - name: Run each catalog example twice in a row
          routerops.opnsense.item:
            return_fields: "{{ item[0]['return_fields'] | default([]) }}"
            items: "{{ item[0]['items'] }}"
          loop: "{{ opnsense_test_examples | product([1, 2]) | list }}"
          loop_control:
            label: "{{ item[0]['name'] }} ({{ item[1] }})"
          register: opnsense_test_examples_run

        - name: Assert that no second example run changed anything
          ansible.builtin.assert:
            that:
              - opnsense_test_examples_run['results'] | selectattr('item.1', '==', 2) | selectattr('changed') | list | length == 0
      always:
        - name: Remove the test certificates and the example certificate
          routerops.opnsense.item:
            items: "{{ opnsense_test_cert_names | map('combine', {'state': 'absent'}) | list }}"

        - name: Remove the CAs
          routerops.opnsense.item:
            path: "{{ opnsense_test_ca_area['path'] }}"
            key: "{{ opnsense_test_ca_area['key'] }}"
            lookup: "{{ opnsense_test_ca_area['lookup'] }}"
            actions: "{{ opnsense_test_ca_area['actions'] }}"
            items: "{{ opnsense_test_ca_names | map('combine', {'state': 'absent'}) | list }}"

        - name: Look up the certificates after the cleanup
          routerops.opnsense.item:
            items: "{{ opnsense_test_cert_names | map('combine', {'state': 'query'}) | list }}"
          register: opnsense_test_left

        - name: Look up the CAs after the cleanup
          routerops.opnsense.item:
            path: "{{ opnsense_test_ca_area['path'] }}"
            key: "{{ opnsense_test_ca_area['key'] }}"
            lookup: "{{ opnsense_test_ca_area['lookup'] }}"
            actions: "{{ opnsense_test_ca_area['actions'] }}"
            items: "{{ opnsense_test_ca_names | map('combine', {'state': 'query'}) | list }}"
          register: opnsense_test_ca_left

        - name: Assert that the cleanup left no certificate or CA behind
          ansible.builtin.assert:
            that:
              - (opnsense_test_left['outcomes'] + opnsense_test_ca_left['outcomes']) | map(attribute='uuid') | select | list | length == 0
