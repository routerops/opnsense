---
- name: Test the item module against Dnsmasq domain overrides
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../meta/areas.yml
  module_defaults:
    group/routerops.opnsense.opnsense:
      path: "{{ opnsense_test_area['path'] }}"
      key: "{{ opnsense_test_area['key'] }}"
      lookup: "{{ opnsense_test_area['lookup'] }}"
      actions: "{{ opnsense_test_area['actions'] | default({}) }}"
      separators: "{{ opnsense_test_area['separators'] | default({}) }}"
      secret_fields: "{{ opnsense_test_area['secret_fields'] | default([]) }}"
      ordered_fields: "{{ opnsense_test_area['ordered_fields'] | default([]) }}"
      always_send: "{{ opnsense_test_area['always_send'] | default([]) }}"
      apply: "{{ opnsense_test_area['apply'] | default(none) }}"
  vars:
    opnsense_test_area: "{{ opnsense_areas['dnsmasq_domain_override'] }}"
    opnsense_test_one:
      domain: one.routerops.test
      ip: 10.250.1.53
      ipset: ""
      descr: routerops test one
    opnsense_test_two:
      domain: one.routerops.test
      ip: 10.250.1.54
      ipset: ""
      descr: routerops test two
    opnsense_test_alias_area: "{{ opnsense_areas['firewall_alias'] }}"
    opnsense_test_aliases:
      - fields:
          name: rt_test_ipset_a
          type: external
          description: routerops test ipset a
      - fields:
          name: rt_test_ipset_b
          type: external
          description: routerops test ipset b
    opnsense_test_ipsets:
      - fields:
          domain: ipset.routerops.test
          ip: ""
          ipset: "{{ opnsense_test_alias_add['outcomes'][0]['uuid'] }}"
          descr: routerops test ipset a
      - fields:
          domain: ipset.routerops.test
          ip: ""
          ipset: "{{ opnsense_test_alias_add['outcomes'][1]['uuid'] }}"
          descr: routerops test ipset b
  tasks:
    - name: Run the domain override tests
      block:
        - name: Add the first domain override in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
          check_mode: true
          register: opnsense_test_check_add

        - name: Add both domain overrides
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_add

        - name: Add both domain overrides again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          register: opnsense_test_again

        - name: Add both domain overrides again in check mode
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
              - fields: "{{ opnsense_test_two }}"
          check_mode: true
          register: opnsense_test_again_check

        - name: Add the external aliases the ipset overrides use
          routerops.opnsense.item:
            path: "{{ opnsense_test_alias_area['path'] }}"
            key: "{{ opnsense_test_alias_area['key'] }}"
            lookup: "{{ opnsense_test_alias_area['lookup'] }}"
            actions: {}
            apply: "{{ opnsense_test_alias_area['apply'] }}"
            items: "{{ opnsense_test_aliases }}"
          register: opnsense_test_alias_add

        - name: Feed one domain into two aliases
          routerops.opnsense.item:
            items: "{{ opnsense_test_ipsets }}"
          register: opnsense_test_ipsets_add

        - name: Remove the two ipset overrides
          routerops.opnsense.item:
            items: "{{ opnsense_test_ipsets | map('combine', {'state': 'absent'}) | list }}"
          register: opnsense_test_ipsets_delete

        - name: Change the description of the first domain override
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'descr': 'routerops test changed'}) }}"
          register: opnsense_test_update

        - name: Change the description of the first domain override again
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'descr': 'routerops test changed'}) }}"
          register: opnsense_test_update_again

        - name: Remove both domain overrides
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent
          register: opnsense_test_delete

        - name: Add a domain override with an invalid value
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one | combine({'domain': 'bad domain'}) }}"
          register: opnsense_test_invalid
          ignore_errors: true

        - name: Assert the results
          ansible.builtin.assert:
            that:
              - opnsense_test_check_add['changed']
              - opnsense_test_check_add['outcomes'][0]['uuid'] is none
              - opnsense_test_add['changed']
              - opnsense_test_add['outcomes'] | map(attribute='action') | list == ['added', 'added']
              - opnsense_test_add['outcomes'] | map(attribute='uuid') | select | list | length == 2
              - not opnsense_test_again['changed']
              - not opnsense_test_again_check['changed']
              - opnsense_test_ipsets_add['outcomes'] | map(attribute='action') | list == ['added', 'added']
              - opnsense_test_ipsets_delete['outcomes'] | map(attribute='action') | list == ['deleted', 'deleted']
              - opnsense_test_update['changed']
              - opnsense_test_update['outcomes'][0]['action'] == 'updated'
              - opnsense_test_update['outcomes'][0]['uuid'] == opnsense_test_add['outcomes'][0]['uuid']
              - not opnsense_test_update_again['changed']
              - opnsense_test_delete['changed']
              - opnsense_test_delete['outcomes'] | map(attribute='action') | list == ['deleted', 'deleted']
              - opnsense_test_invalid['failed']
              - "'domainoverride.domain' in opnsense_test_invalid['validations']"

        - name: Run each catalog example twice in a row
          routerops.opnsense.item:
            return_fields: "{{ item[0]['return_fields'] | default([]) }}"
            items: "{{ item[0]['items'] }}"
          loop: "{{ opnsense_test_area['examples'] | product([1, 2]) | list }}"
          loop_control:
            label: "{{ item[0]['name'] }} ({{ item[1] }})"
          register: opnsense_test_examples

        - name: Assert that no second example run changed anything
          ansible.builtin.assert:
            that:
              - opnsense_test_examples['results'] | selectattr('item.1', '==', 2) | selectattr('changed') | list | length == 0
      always:
        - name: Remove both test domain overrides
          routerops.opnsense.item:
            items:
              - fields: "{{ opnsense_test_one }}"
                state: absent
              - fields: "{{ opnsense_test_two }}"
                state: absent

        - name: Remove the catalog examples
          routerops.opnsense.item:
            items: >-
              {{ ((item['items'] | rejectattr('state', 'defined') | list)
                  + (item['items'] | selectattr('state', 'defined') | rejectattr('state', 'equalto', 'query') | list))
                 | map('combine', {'state': 'absent'}) | list }}
          loop: "{{ opnsense_test_area['examples'] }}"
          loop_control:
            label: "{{ item['name'] }}"

        - name: Remove the ipset overrides
          routerops.opnsense.item:
            items: "{{ opnsense_test_ipsets | map('combine', {'state': 'absent'}) | list }}"
          when: opnsense_test_alias_add['outcomes'] is defined

        - name: Remove the external aliases
          routerops.opnsense.item:
            path: "{{ opnsense_test_alias_area['path'] }}"
            key: "{{ opnsense_test_alias_area['key'] }}"
            lookup: "{{ opnsense_test_alias_area['lookup'] }}"
            actions: {}
            apply: "{{ opnsense_test_alias_area['apply'] }}"
            items: "{{ opnsense_test_aliases | map('combine', {'state': 'absent'}) | list }}"

        - name: Look up the domain overrides after the cleanup
          routerops.opnsense.item:
            items: >-
              {{ ([{'fields': opnsense_test_one}, {'fields': opnsense_test_two}] + opnsense_test_area['examples'][0]['items'])
                 | map('combine', {'state': 'query'}) | list }}
          register: opnsense_test_left

        - name: Assert that the cleanup removed every domain override
          ansible.builtin.assert:
            that:
              - opnsense_test_left['outcomes'] | map(attribute='uuid') | select | list | length == 0
