      `connection` is the uuid of an IPsec connection; `connection` and `description` together identify an entry, so keep descriptions unique per connection.
      Deleting the connection deletes this entry too.
      The apply needs IPsec enabled, as described for the IPsec connection.
      In the examples, replace `EXAMPLE_CONNECTION_UUID` with the `uuid` the connection example returns.
    examples:
      - name: Authenticate the remote side with a pre-shared key
        items:
          - fields:
              connection: EXAMPLE_CONNECTION_UUID
              auth: psk
              id: rt-example-remote.routerops.test
              description: routerops example remote
      - name: Remove the remote authentication
        items:
          - fields:
              connection: EXAMPLE_CONNECTION_UUID
              description: routerops example remote
            state: absent
