---
opnsense_areas:
  dnsmasq_host:
    area: dnsmasq
    title: Dnsmasq host
    module: item
    path: dnsmasq/settings
    key: host
    lookup: [host, domain]
    actions:
      search: searchHost
      get: getHost
      add: addHost
      set: setHost
      del: delHost
    apply: dnsmasq/service/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Dnsmasq/Dnsmasq.xml
      node: hosts
    privileges:
      - name: page-services-dnsforwarder
        title: "Services: Dnsmasq DNS/DHCP: Settings"
        pattern: api/dnsmasq/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Dnsmasq/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    examples:
      - name: Add a Dnsmasq host
        items:
          - fields:
              host: printer
              domain: example.test
              ip: 192.0.2.10
      - name: Keep only the listed Dnsmasq hosts
        purge: true
        items:
          - fields:
              host: printer
              domain: example.test
              ip: 192.0.2.10
          - fields:
              host: scanner
              domain: example.test
              ip: 192.0.2.11
      - name: Remove a Dnsmasq host
        items:
          - fields:
              host: scanner
              domain: example.test
            state: absent

  firewall_alias:
    area: firewall
    title: Firewall alias
    module: item
    path: firewall/alias
    key: alias
    lookup: [name]
    secret_fields: [password]
    separators:
      content: "\n"
    apply: firewall/alias/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Firewall/Alias.xml
      node: aliases.alias
    privileges:
      - name: page-firewall-alias-edit
        title: "Firewall: Alias: Edit"
        pattern: api/firewall/alias/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Core/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    examples:
      - name: Keep a host alias
        items:
          - fields:
              name: web_servers
              type: host
              content: [192.0.2.21, 192.0.2.22]
              description: Web servers
      - name: Keep a port alias
        items:
          - fields:
              name: web_ports
              type: port
              content: ["80", "443"]
              description: Web ports
      - name: Read a built-in alias
        return_fields: [type]
        items:
          - fields:
              name: bogons
            state: query

  firewall_destination_nat:
    area: firewall
    title: Firewall destination NAT
    module: item
    path: firewall/d_nat
    key: rule
    lookup: [descr]
    actions:
      search: searchRule
      get: getRule
      add: addRule
      set: setRule
      del: delRule
    apply: firewall/d_nat/apply
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Firewall/DNat.xml
      node: rule
    privileges:
      - name: page-firewall-nat-portforward-edit
        title: "Firewall: NAT: Destination NAT"
        pattern: api/firewall/d_nat/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Core/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    examples:
      - name: Forward port 8080 on WAN to a LAN web server
        items:
          - fields:
              interface: wan
              protocol: tcp
              destination:
                network: wanip
                port: "8080"
              target: 10.250.1.50
              local-port: "80"
              descr: routerops example web
      - name: Remove a port forward
        items:
          - fields:
              descr: routerops example web
            state: absent

  firewall_filter_rule:
    area: firewall
    title: Firewall filter rule
    module: item
    path: firewall/filter
    key: rule
    lookup: [description]
    actions:
      search: searchRule
      get: getRule
      add: addRule
      set: setRule
      del: delRule
    apply: firewall/filter/apply
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Firewall/Filter.xml
      node: rules.rule
    privileges:
      - name: page-filter-api
        title: "Firewall: Rules [new]"
        pattern: api/firewall/filter/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Firewall/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    examples:
      - name: Allow HTTPS to the firewall from LAN
        items:
          - fields:
              interface: lan
              protocol: TCP
              source_net: lan
              destination_net: (self)
              destination_port: "443"
              description: routerops example https
      - name: Block a host on LAN
        items:
          - fields:
              action: block
              source_net: 10.250.1.99
              description: routerops example block
      - name: Remove a filter rule
        items:
          - fields:
              description: routerops example block
            state: absent

  firewall_one_to_one_nat:
    area: firewall
    title: Firewall one-to-one NAT
    module: item
    path: firewall/one_to_one
    key: rule
    lookup: [description]
    actions:
      search: searchRule
      get: getRule
      add: addRule
      set: setRule
      del: delRule
    apply: firewall/one_to_one/apply
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Firewall/Filter.xml
      node: onetoone.rule
    privileges:
      - name: page-firewall-nat-1-1-edit
        title: "Firewall: NAT: 1:1"
        pattern: api/firewall/one_to_one/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Firewall/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    examples:
      - name: Map a LAN host to a WAN address
        items:
          - fields:
              source_net: 10.250.1.50
              external: 10.250.0.50
              description: routerops example one
      - name: Keep only the listed one-to-one rules
        purge: true
        items:
          - fields:
              source_net: 10.250.1.50
              external: 10.250.0.50
              description: routerops example one
          - fields:
              source_net: 10.250.1.51
              external: 10.250.0.51
              description: routerops example two
      - name: Remove a one-to-one rule
        items:
          - fields:
              description: routerops example two
            state: absent

  firewall_source_nat:
    area: firewall
    title: Firewall source NAT rule
    module: item
    path: firewall/source_nat
    key: rule
    lookup: [description]
    actions:
      search: searchRule
      get: getRule
      add: addRule
      set: setRule
      del: delRule
    apply: firewall/source_nat/apply
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Firewall/Filter.xml
      node: snatrules.rule
    privileges:
      - name: page-filter-snat-api
        title: "Firewall: NAT: Source NAT"
        pattern: api/firewall/source_nat/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Firewall/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      OPNsense lists source NAT rules only in the outbound NAT mode `hybrid` or `advanced` (default `automatic`);
      set the mode with the outbound NAT mode entry first, or every run adds a duplicate rule and `absent` finds nothing.
    examples:
      - name: Translate a LAN subnet on WAN
        items:
          - fields:
              interface: wan
              source_net: 10.250.1.0/24
              description: routerops example lan
      - name: Remove a source NAT rule
        items:
          - fields:
              description: routerops example lan
            state: absent

  firewall_source_nat_general:
    area: firewall
    title: Firewall outbound NAT mode
    module: settings
    path: firewall/source_nat
    key: filter.general
    apply: firewall/source_nat/apply
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Firewall/Filter.xml
      node: general
    privileges:
      - name: page-filter-snat-api
        title: "Firewall: NAT: Source NAT"
        pattern: api/firewall/source_nat/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Firewall/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    examples:
      - name: Use hybrid outbound NAT
        fields:
          snat_mode: hybrid
  interfaces_vlan:
    area: interfaces
    title: VLAN
    module: item
    path: interfaces/vlan_settings
    key: vlan
    lookup: [descr]
    apply: interfaces/vlan_settings/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Interfaces/Vlan.xml
      node: vlan
    privileges:
      - name: page-interfaces-vlan-edit
        title: "Interfaces: VLAN"
        pattern: api/interfaces/vlan_settings/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Interfaces/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      Set `vlanif` (`vlan0.<tag>`) so the device name is known before the VLAN is assigned;
      OPNsense refuses to delete a VLAN that is assigned as an interface.
    examples:
      - name: Add a VLAN on the LAN port
        items:
          - fields:
              if: vtnet1
              tag: 4009
              vlanif: vlan0.4009
              descr: routerops example
      - name: Remove a VLAN
        items:
          - fields:
              descr: routerops example
            state: absent
  interfaces_vip:
    area: interfaces
    title: Virtual IP
    module: item
    path: interfaces/vip_settings
    key: vip
    lookup: [descr]
    secret_fields: [password]
    api_fields:
      network: address and prefix length (`10.250.1.240/24`), which OPNsense stores as `subnet` and `subnet_bits`
    apply: interfaces/vip_settings/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Interfaces/Vip.xml
      node: vip
    privileges:
      - name: page-firewall-virtualipaddress-edit
        title: "Interfaces: Virtual IPs: Settings"
        pattern: api/interfaces/vip_settings/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Interfaces/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      Send the address as `network`; OPNsense reads and returns it in that form, not as `subnet` and `subnet_bits`.
      Descriptions identify a virtual IP; keep them unique.
      A CARP `password` is returned in clear, so name it in `secret_fields`.
    examples:
      - name: Add an IP alias on LAN
        items:
          - fields:
              mode: ipalias
              interface: lan
              network: 10.250.1.250/24
              descr: routerops example
      - name: Remove a virtual IP
        items:
          - fields:
              descr: routerops example
            state: absent
  interfaces_assignment:
    area: interfaces
    title: Assignment
    module: item
    path: interfaces/assignment
    key: interface
    lookup: [descr]
    id_format: name
    apply: interfaces/assignment/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Interfaces/NetworkInterface.xml
      node: interface
    privileges:
      - name: page-interfaces-assignnetworkports
        title: "Interfaces: Assign network ports"
        pattern: api/interfaces/assignment/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Core/ACL/ACL.xml
    min_version: "26.7.6"
    tested: ["26.7.7"]
    stage: v0
    note: >-
      Items are keyed by the interface name (`opt1`); the outcome `uuid` is that name, which a virtual IP takes as `interface`.
      The apply runs `interface apply` for every pending interface change, including ones made in the GUI,
      and can cut the management connection when it touches the interface you connect through.
      Set `lock: false`, or OPNsense refuses the delete.
      A deleted assignment takes its firewall and NAT rules with it and leaves its virtual IPs behind; delete those first.
      `type6: ""` means no IPv6.
      The examples assign the VLAN from the VLAN example, which must exist first.
    examples:
      - name: Assign a VLAN with a static address
        items:
          - fields:
              if: vlan0.4009
              descr: rt_example
              enable: true
              lock: false
              type4: staticv4
              ipaddr: 10.250.49.1/24
              type6: ""
      - name: Remove an assignment
        items:
          - fields:
              descr: rt_example
            state: absent

  nodeexporter_general:
    area: nodeexporter
    title: node_exporter general
    module: settings
    path: nodeexporter/general
    key: general
    apply: nodeexporter/service/reconfigure
    model:
      repo: plugins
      file: sysutils/node_exporter/src/opnsense/mvc/app/models/OPNsense/NodeExporter/General.xml
    privileges:
      - name: page-services-nodeexporter
        title: "Services: Prometheus Exporter"
        pattern: api/nodeexporter/*
        acl: opnsense-plugins/sysutils/node_exporter/src/opnsense/mvc/app/models/OPNsense/NodeExporter/ACL/ACL.xml
    tested: ["26.7.7"]
    plugin: os-node_exporter
    stage: v0
    examples:
      - name: Enable node_exporter on port 9100
        fields:
          enabled: true
          listenport: 9100

  routes_static_route:
    area: routes
    title: Static route
    module: item
    path: routes/routes
    key: route
    lookup: [network]
    actions:
      search: searchroute
      get: getroute
      add: addroute
      set: setroute
      del: delroute
    apply: routes/routes/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Routes/Route.xml
      node: route
    privileges:
      - name: page-system-staticroutes
        title: "System: Static Routes"
        pattern: api/routes/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Core/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      The gateway a route names must exist before the route; OPNsense caches its gateway list for 20 seconds,
      so a route sent right after a new gateway can fail validation.
    examples:
      - name: Route a remote network through a LAN gateway
        items:
          - fields:
              network: 10.99.0.0/24
              gateway: RT_EXAMPLE_GW
              descr: routerops example
      - name: Keep only the listed static routes
        purge: true
        items:
          - fields:
              network: 10.99.0.0/24
              gateway: RT_EXAMPLE_GW
              descr: routerops example
          - fields:
              network: 10.99.1.0/24
              gateway: RT_EXAMPLE_GW
              descr: routerops example
      - name: Remove a static route
        items:
          - fields:
              network: 10.99.1.0/24
            state: absent

  routing_gateway:
    area: routing
    title: Gateway
    module: item
    path: routing/settings
    key: gateway_item
    lookup: [name]
    actions:
      search: searchGateway
      get: getGateway
      add: addGateway
      set: setGateway
      del: delGateway
    apply: routing/settings/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Routing/Gateways.xml
      node: gateway_item
    privileges:
      - name: page-system-gateways
        title: "System: Gateways"
        pattern: api/routing/settings/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Core/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      Gateways OPNsense generates for dynamic interfaces, such as `WAN_DHCP`, carry their name as `uuid` and are not items of this area:
      `present` and `absent` do not find them, so `present` with such a name sends an add; `state: query` finds them.
    examples:
      - name: Add a LAN gateway
        items:
          - fields:
              name: RT_EXAMPLE_GW
              interface: lan
              gateway: 10.250.1.254
              descr: routerops example
      - name: Remove a gateway
        items:
          - fields:
              name: RT_EXAMPLE_GW
            state: absent
  unbound_general:
    area: unbound
    title: Unbound general
    module: settings
    path: unbound/settings
    key: unbound.general
    apply: unbound/service/reconfigureGeneral
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Unbound/Unbound.xml
      node: general
    privileges:
      - name: page-services-unbound
        title: "Services: Unbound"
        pattern: api/unbound/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Unbound/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      Every apply restarts Unbound, so DNS stops answering for a moment.
      A save that changes `enabled` or `port` fails while another service uses the port.
    examples:
      - name: Enable TXT records for host overrides
        fields:
          txtsupport: true
  unbound_host_override:
    area: unbound
    title: Host override
    module: item
    path: unbound/settings
    key: host
    lookup: [hostname, domain, rr]
    actions:
      search: searchHostOverride
      get: getHostOverride
      add: addHostOverride
      set: setHostOverride
      del: delHostOverride
    apply: unbound/service/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Unbound/Unbound.xml
      node: hosts.host
    privileges:
      - name: page-services-unbound
        title: "Services: Unbound"
        pattern: api/unbound/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Unbound/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      Do not send `aliases`: OPNsense adds and deletes alias items from it; manage them with the host alias area.
      The lookup includes `rr`, so an A and an AAAA record for one name are two items.
      Deleting a host override also deletes its aliases.
      Every apply restarts Unbound.
    examples:
      - name: Add a host override
        items:
          - fields:
              hostname: rt-example
              domain: routerops.test
              rr: A
              server: 10.250.1.30
              description: routerops example
      - name: Remove a host override
        items:
          - fields:
              hostname: rt-example
              domain: routerops.test
              rr: A
            state: absent
  unbound_host_alias:
    area: unbound
    title: Host alias
    module: item
    path: unbound/settings
    key: alias
    lookup: [host, hostname, domain]
    actions:
      search: searchHostAlias
      get: getHostAlias
      add: addHostAlias
      set: setHostAlias
      del: delHostAlias
    apply: unbound/service/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Unbound/Unbound.xml
      node: aliases.alias
    privileges:
      - name: page-services-unbound
        title: "Services: Unbound"
        pattern: api/unbound/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Unbound/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      `host` is the uuid of a host override; register it from the host override's outcome.
      The lookup includes `domain`, because an alias may set only a domain.
      Send `domain: ""` to take the host's domain; the lookup needs the field.
      In the examples, replace `HOST_OVERRIDE_UUID` with the `uuid` the example in the Host override section returns.
    examples:
      - name: Add an alias for the example host
        items:
          - fields:
              host: HOST_OVERRIDE_UUID
              hostname: rt-example-alias
              domain: ""
              description: routerops example
      - name: Remove the alias
        items:
          - fields:
              host: HOST_OVERRIDE_UUID
              hostname: rt-example-alias
              domain: ""
            state: absent
  unbound_forward:
    area: unbound
    title: Query forward
    module: item
    path: unbound/settings
    key: dot
    lookup: [domain, server]
    actions:
      search: searchForward
      get: getForward
      add: addForward
      set: setForward
      del: delForward
    apply: unbound/service/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Unbound/Unbound.xml
      node: dots.dot
    privileges:
      - name: page-services-unbound
        title: "Services: Unbound"
        pattern: api/unbound/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Unbound/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      Forward and DNS over TLS items share one list; the action name sets `type` and overwrites a sent one, so never send it, or every run shows a change.
      An empty `domain` forwards every query.
      Every apply restarts Unbound.
    examples:
      - name: Forward a domain
        items:
          - fields:
              domain: routerops.test
              server: 10.250.1.53
              description: routerops example
      - name: Remove a forward
        items:
          - fields:
              domain: routerops.test
              server: 10.250.1.53
            state: absent
  unbound_acl:
    area: unbound
    title: ACL
    module: item
    path: unbound/settings
    key: acl
    lookup: [name]
    actions:
      search: searchAcl
      get: getAcl
      add: addAcl
      set: setAcl
      del: delAcl
    apply: unbound/service/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Unbound/Unbound.xml
      node: acls.acl
    privileges:
      - name: page-services-unbound
        title: "Services: Unbound"
        pattern: api/unbound/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Unbound/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      Names are not unique; keep them unique, the lookup takes the name.
      Every apply restarts Unbound.
    examples:
      - name: Allow a network
        items:
          - fields:
              name: routerops_example
              action: allow
              networks: [10.250.72.0/24]
              description: routerops example
      - name: Remove an ACL
        items:
          - fields:
              name: routerops_example
            state: absent
  kea_dhcpv4_general:
    area: kea
    title: Kea DHCPv4 general
    module: settings
    path: kea/dhcpv4
    key: dhcpv4.general
    apply: kea/service/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Kea/KeaDhcpv4.xml
      node: general
    privileges:
      - name: page-dhcp-kea-v4
        title: "Services: DHCP: Kea(v4)"
        pattern: api/kea/dhcpv4/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Kea/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
    note: >-
      Kea serves DHCP only with `enabled: true` and at least one entry in `interfaces`.
      A save rewrites the router, DNS and NTP options of every subnet that collects them automatically and lies on an interface.
    examples:
      - name: Set the default lease time
        fields:
          valid_lifetime: 7200
  kea_dhcpv4_subnet:
    area: kea
    title: DHCPv4 subnet
    module: item
    path: kea/dhcpv4
    key: subnet4
    lookup: [subnet]
    actions:
      search: searchSubnet
      get: getSubnet
      add: addSubnet
      set: setSubnet
      del: delSubnet
    separators:
      pools: "\n"
    secret_fields: [ddns_domain_key_secret]
    apply: kea/service/reconfigure
    model:
      repo: core
      file: src/opnsense/mvc/app/models/OPNsense/Kea/KeaDhcpv4.xml
      node: subnets.subnet4
    privileges:
      - name: page-dhcp-kea-v4
        title: "Services: DHCP: Kea(v4)"
        pattern: api/kea/dhcpv4/*
        acl: opnsense-core/src/opnsense/mvc/app/models/OPNsense/Kea/ACL/ACL.xml
    tested: ["26.7.7"]
    stage: v0
